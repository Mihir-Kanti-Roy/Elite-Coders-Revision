<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sandbox  </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction: column;
    margin:0;
    perspective:800px;
    background-color: black;
    color: white;
}

.card{
    width:40vh;
    height:40vh;
    position:relative;
    transform-style: preserve-3d;
    animation: spin 3.5s linear infinite;
}

.card img{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
}

.back{
    transform: rotateY(180deg);
}

div{
    background-color: black;
}

h1{
    padding: 3vh;
    font-size: 8vh;
      font-family: "Pixelify Sans", sans-serif;
}

@keyframes spin{
    from{ transform: rotateY(0deg); }
    to{ transform: rotateY(360deg); }
}

button{
    font-family: "Pixelify Sans", sans-serif;
    font-size: 4vh;
    padding: 1vh 4vh;
    background:black;
    color:white;
    border:2px solid white;
    cursor:pointer;
    padding: 2vh;
}

button:hover{
    background:white;
    color:black;
}

</style>
</head>

<body>
<h1>Gravitas</h1>
<div class="card">

<img src="https://www.shutterstock.com/image-vector/black-dragon-logo-vector-on-600nw-2489839995.jpg">

<img class="back"
src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkHg3meRh5rc5D62bnde4hmPPDQ7cyJT5x8Q&s">

</div>
<button onclick="location.href='https://playcanv.as/p/M2t6yYtV/'">Play</button></body>
</html>
